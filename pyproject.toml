[project]
name = "fork-cast"
version = "0.2.0"
description = "Zero-tagging food decision engine powered by Jev System 1 model"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
fork-cast = "fork_cast.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fork_cast"]
